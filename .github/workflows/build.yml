name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  # PR 只跑校验，不打包（打包慢且没有产物价值）
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release；失败时推送 ci-logs 分支

jobs:
  # 先验证再打包：以前 CI 只会 npm run dist，lint/类型/单测/冒烟全靠本地自觉，
  # 红了的提交照样能出安装包。
  verify:
    runs-on: windows-latest
    env:
      # 校验不需要 Electron 二进制（150MB+）：服务端在纯 Node 下不会去碰它
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # 冒烟只测接口行为，别为了入库查重去下 CLIP 模型（加载与否会让结论随机变）
      GEM_CLIP: 'off'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist/ 不入库，不构建的话冒烟只能测到「前端尚未构建」兜底页，
      # 首页与 CSP 这些就变成对着占位页断言了
      - name: Build web
        run: npm run build

      - name: Verify (lint + typecheck + unit + smoke)
        run: npm run verify

  build:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: |
          npm run dist -- --publish never *> build-out.txt
          exit $LASTEXITCODE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder,electron-builder:npm

      - name: Push build log to ci-logs branch (failure only)
        if: failure()
        run: |
          git config user.name "ci-log"
          git config user.email "ci@example.com"
          git checkout --orphan ci-logs
          git add -f build-out.txt
          git commit -m "CI build log"
          git push -f origin ci-logs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release-build/*.exe
            release-build/*.blockmap
            release-build/latest.yml
          retention-days: 14
          if-no-files-found: error

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-build/*.exe
            release-build/*.blockmap
            release-build/latest.yml
